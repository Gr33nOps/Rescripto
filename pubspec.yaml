name: rescripto
description: "Rescripto - private on-device AI rewriting with locally stored content and downloadable models."
publish_to: 'none'
version: 1.2.4+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # On-device LLM inference (llama.cpp). GGUF models, Metal/Vulkan GPU acceleration.
  # Vendored because the published package expects llama.cpp checked out at a
  # fixed path; see third_party/llama.cpp (pinned b6500).
  flutter_llama:
    path: third_party/flutter_llama

  # On-device speech-to-text (whisper.cpp). No cloud, no API keys.
  # Vendored because the published package ships without whisper.cpp's
  # examples/miniaudio (needed for WAV decoding); the bundled miniaudio.h is
  # restored here. See third_party/flutter_whisper.
  flutter_whisper:
    path: third_party/flutter_whisper

  # Pinned to v12: v13's android package requires compileSdk 37, which the
  # Android SDK exposes only as the android-37.0 preview platform.
  permission_handler: ^12.0.1

  # Local storage: history + settings + downloads.
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Model download manager (HuggingFace GGUF files).
  dio: ^5.11.0
  crypto: ^3.0.7

  # The network guard's http.Client path (for flutter_whisper's downloader).
  # Version matches third_party/flutter_whisper's own constraint.
  http: ^1.2.0

  # BYO API keys, backed by Android Keystore (EncryptedSharedPreferences).
  # Never written to SharedPreferences, SQLite, or Android's own backup.
  flutter_secure_storage: ^9.2.4

  # State management.
  provider: ^6.1.5+1

  # Share rewritten text.
  share_plus: ^12.0.1
  url_launcher: ^6.3.2

  # Formatting.
  intl: ^0.20.2

  # Encrypted backup (Phase 4): Argon2id key derivation + AES-GCM, pure Dart
  # so it's testable on the host without a platform channel.
  cryptography: ^2.7.0
  # Zips a backup bundle's per-section payloads into one file.
  archive: ^3.6.1
  # Picking a backup file to import.
  file_picker: ^10.3.5
  # Parsing WebDAV PROPFIND responses (Phase 4 sync).
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Runs SQLite in the test process so schema migrations can be verified on the
  # host. sqflite itself needs a device.
  sqflite_common_ffi: ^2.3.6

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
