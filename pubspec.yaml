name: rescripto
description: "Rescripto - Completely free, fully offline & local AI text rewrite app. 100% on-device, zero data leaves the phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # On-device LLM inference (llama.cpp). GGUF models, Metal/Vulkan GPU acceleration.
  # Vendored because the published package expects llama.cpp checked out at a
  # fixed path; see third_party/llama.cpp (pinned b6500).
  flutter_llama:
    path: third_party/flutter_llama

  # On-device speech-to-text (whisper.cpp). No cloud, no API keys.
  # Vendored because the published package ships without whisper.cpp's
  # examples/miniaudio (needed for WAV decoding); the bundled miniaudio.h is
  # restored here. See third_party/flutter_whisper.
  flutter_whisper:
    path: third_party/flutter_whisper

  # Audio recording used for voice input / dictation.
  record: ^7.1.1
  # Pinned to v12: v13's android package requires compileSdk 37, which the
  # Android SDK exposes only as the android-37.0 preview platform.
  permission_handler: ^12.0.1

  # Local storage: history + settings + downloads.
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Model download manager (HuggingFace GGUF files).
  dio: ^5.11.0

  # State management.
  provider: ^6.1.5+1

  # Share rewritten text.
  share_plus: ^12.0.1

  # Formatting.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
