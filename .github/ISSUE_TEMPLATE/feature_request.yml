name: Feature request
description: Share an idea that could make Rescripto more useful.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that Rescripto cannot do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? A rough idea is completely fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered, and why do they not fit as well?
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: >
        Local mode does not use the network to rewrite text. If this idea
        would change what leaves the device, please explain that trade-off.
      options:
        - label: This doesn't change what leaves the device, or I've described the tradeoff above.
