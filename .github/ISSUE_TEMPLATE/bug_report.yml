name: Bug report
description: Something in Rescripto isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please don't use this form for security
        issues — see [SECURITY.md](https://github.com/Gr33nOps/Rescripto/blob/main/.github/SECURITY.md)
        instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Settings → ...
        2. Tap ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Rescripto version
      description: Settings → About, or the release tag you installed.
      placeholder: v1.1.2
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 15
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Processing mode
      options:
        - Local
        - Cloud
        - Hybrid
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >
        `adb logcat` output, or a screenshot, if you have one. This helps a
        lot for anything involving a crash or the network log.
    validations:
      required: false
