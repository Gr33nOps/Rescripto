name: Bug report
description: Tell us about something in Rescripto that did not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please do not include
        security details here. Use [SECURITY.md](https://github.com/Gr33nOps/Rescripto/blob/main/.github/SECURITY.md)
        to report those privately instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you saw, in your own words.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Tell us what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Settings → ...
        2. Tap ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Rescripto version
      description: Settings → About, or the release tag you installed.
      placeholder: v1.2.1
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 15
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Processing mode
      options:
        - Local
        - Cloud
        - Hybrid
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >
        A screenshot or `adb logcat` output is helpful, especially for a
        crash or network issue. Please remove any private information first.
    validations:
      required: false
