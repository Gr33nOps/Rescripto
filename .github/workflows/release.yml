name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: production
    env:
      NDK_CCACHE: ccache
      # Fail the build instead of publishing an unsigned APK if a signing
      # secret is missing. See android/app/build.gradle.kts.
      RESCRIPTO_REQUIRE_SIGNING: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install Android native build tools
        run: |
          sudo apt-get update
          # libsqlite3-dev: sqflite_common_ffi runs SQLite in-process for the
          # migration/config-store/network-log/credential-store tests, since
          # sqflite itself needs a device.
          sudo apt-get install -y ccache libsqlite3-dev
          ccache --max-size=6G
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Cache ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('third_party/llama.cpp/src/**', 'third_party/llama.cpp/ggml/**', 'packages/rescripto_llama/android/src/main/cpp/**', 'third_party/flutter_whisper/third_party/whisper.cpp/src/**', 'third_party/flutter_whisper/third_party/whisper.cpp/ggml/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release tag
        run: |
          APP_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"

      - name: Analyze and test application
        run: |
          flutter analyze
          flutter test

      - name: Verify rescripto_llama
        working-directory: packages/rescripto_llama
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Verify flutter_whisper
        working-directory: third_party/flutter_whisper
        run: |
          flutter pub get
          flutter analyze lib
          flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/rescripto-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rescripto-upload.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        timeout-minutes: 180
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Build release App Bundle
        timeout-minutes: 120
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --target-platform android-arm64

      - name: Extract release notes
        # Uses this version's section of CHANGELOG.md, so the release page
        # says what changed in words rather than a list of commit titles.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          test -s "$RUNNER_TEMP/release_notes.md"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Rescripto ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
