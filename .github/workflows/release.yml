name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NDK_CCACHE: ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build tools (ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --max-size=6G

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('third_party/flutter_llama/llama.cpp/src/**', 'third_party/flutter_llama/llama.cpp/ggml/**', 'third_party/flutter_whisper/third_party/whisper.cpp/src/**', 'third_party/flutter_whisper/third_party/whisper.cpp/ggml/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        timeout-minutes: 180
        run: flutter build apk --release

      - name: Build release App Bundle
        timeout-minutes: 120
        run: flutter build appbundle --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
