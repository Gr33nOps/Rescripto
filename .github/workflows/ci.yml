name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_CCACHE: ccache
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install Android native build tools
        run: |
          sudo apt-get update
          # libsqlite3-dev: sqflite_common_ffi runs SQLite in-process for the
          # migration/config-store/network-log/credential-store tests, since
          # sqflite itself needs a device. Without it those tests fail to
          # find a native SQLite to load.
          sudo apt-get install -y ccache libsqlite3-dev
          ccache --max-size=6G
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Cache native objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('third_party/flutter_llama/llama.cpp/src/**', 'third_party/flutter_llama/llama.cpp/ggml/**', 'third_party/flutter_whisper/third_party/whisper.cpp/src/**', 'third_party/flutter_whisper/third_party/whisper.cpp/ggml/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze

      - name: Test application
        run: flutter test

      - name: Verify flutter_llama
        working-directory: third_party/flutter_llama
        run: |
          flutter pub get
          flutter analyze lib
          flutter test

      - name: Verify flutter_whisper
        working-directory: third_party/flutter_whisper
        run: |
          flutter pub get
          flutter analyze lib
          flutter test

      - name: Lint Android debug build
        # AGP does not verify a manifest-declared class (an <activity> or
        # <service> name) against the compiled classpath — that only fails
        # at install time on a device. This is the one check that catches it
        # in CI, before a full APK build.
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Build Android debug APK
        run: flutter build apk --debug --target-platform android-arm64
