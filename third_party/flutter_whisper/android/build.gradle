group = "io.github.govindtank.flutter_whisper"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "1.9.22"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.3.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "io.github.govindtank.flutter_whisper"
    }

    // Kept in step with the app and flutter_llama; mismatched NDKs across
    // modules make AGP pick one arbitrarily for the merged native libs.
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        ndk {
            // The app only ships arm64-v8a; building armeabi-v7a produced a
            // library that was packaged and then stripped back out again.
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                // Whisper used to build with no optimisation flags and no ARM
                // baseline, so transcription ran on scalar fallbacks — the same
                // problem flutter_llama had. -O3 plus dotprod is what makes
                // dictation finish in seconds instead of minutes.
                cppFlags "-std=c++17 -fexceptions -frtti -O3"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-28",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
