group = "io.github.govindtank.flutter_whisper"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "1.9.22"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.3.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "io.github.govindtank.flutter_whisper"
    }

    // Kept in step with the app and flutter_llama; mismatched NDKs across
    // modules make AGP pick one arbitrarily for the merged native libs.
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        // onNativeProgress is invoked only through JNI. Without a consumer
        // rule, R8 cannot see that call and renames the method in release
        // builds, which makes GetMethodID fail and terminates the app.
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            // The app only ships arm64-v8a; building armeabi-v7a produced a
            // library that was packaged and then stripped back out again.
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                // Keep optimisation while retaining the ARMv8-A baseline.
                // Devices without dot-product support must still be able to
                // load the on-device voice library.
                cppFlags "-std=c++17 -fexceptions -frtti -O3"
                arguments "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
