group = "com.example.flutter_llama"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "net.nativemind.flutter_llama"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24

        // NDK configuration
        ndkVersion = "26.1.10909125"
        ndk {
            // Specify ABIs to build (arm64 only for modern devices)
            abiFilters 'arm64-v8a'
        }
        
        // CMake configuration
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti -O3'
                def cmakeArgs = [
                    '-DANDROID_STL=c++_shared',
                    '-DANDROID_PLATFORM=android-28',
                    '-DCMAKE_BUILD_TYPE=Release'
                ]
                // llama.cpp's ggml-vulkan backend needs a working glslc to
                // generate its shaders. The Android NDK ships one under
                // shader-tools/, but CMake's FindVulkan won't locate it, so
                // point it there explicitly when no Vulkan SDK glslc exists.
                def sdkDir = android.sdkDirectory.absolutePath
                def ndkVer = '26.1.10909125'
                def glslc = new File("$sdkDir/ndk/$ndkVer/shader-tools/windows-x86_64/glslc.exe")
                if (glslc.exists()) {
                    cmakeArgs.add("-DVulkan_GLSLC_EXECUTABLE=${glslc.absolutePath.replace('\\', '/')}")
                }
                arguments(*cmakeArgs)
            }
        }
    }
    
    // External native build configuration
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            // llama.cpp's ggml-vulkan backend requires CMake >= 3.19.
            version = '3.22.1'
        }
    }
    
    // Build types
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
