name: rescripto_llama
description: On-device text generation for Rescripto, built on llama.cpp.
version: 1.0.0
publish_to: 'none'
repository: https://github.com/Gr33nOps/Rescripto

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rescripto.llama
        pluginClass: RescriptoLlamaPlugin
